version: '3'
services:
  app:
    image: .
    env_file:
      - .env
    container_name: fas-server
    restart: always
    ports:
      - '$PORT:$PORT'
    networks:
      - backend_server
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '$REDIS_PORT:$REDIS_PORT'
    environment:
      - 'REDIS_PASSWORD=${REDIS_PASSWORD}'
    command: /bin/sh -c "redis-server --requirepass ${REDIS_PASSWORD}"
    env_file:
      - .env
    volumes:
      - ./redis-data:/redis-data
    networks:
      - backend_server
networks:
  fas_server:
    driver: bridge
